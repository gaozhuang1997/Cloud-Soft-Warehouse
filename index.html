<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>好用软件分享站</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;font-family:system-ui}
        body{background:#f4f4f5;padding:30px;max-width:1000px;margin:0 auto}
        h1{text-align:center;margin-bottom:40px;color:#222}
        .card{background:#fff;border-radius:12px;padding:20px;margin-bottom:16px;box-shadow:0 2px 8px #00000010}
        .card h3{margin-bottom:8px}
        .card p{color:#555;margin-bottom:12px}
        .btn{display:inline-block;background:#2563eb;color:#fff;padding:8px 16px;border-radius:8px;text-decoration:none}
    </style>
</head>
<body>
    <h1>软件分享</h1>

    <div class="card">
        <h3>软件名称1</h3>
        <p>软件简介：xxx</p>
        <a class="btn" href="这里粘贴你的网盘分享链接" target="_blank">前往下载</a>
    </div>

    <div class="card">
        <h3>软件名称2</h3>
        <p>软件简介：xxx</p>
        <a class="btn" href="这里粘贴你的网盘分享链接" target="_blank">前往下载</a>
    </div>

</body>
</html>
